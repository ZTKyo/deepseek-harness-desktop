# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# Notion MCP server: reads the user's Notion workspace via the official
# @notionhq/notion-mcp-server (stdio).
#
# Security-Hardening (SH-R1 / SH-R2-4): the token is NEVER stored in this file.
# start-dsh-server.ps1 preflights the NOTION_TOKEN ref in the local credential
# store and injects it into the host process environment only AFTER validation.
# dsh web runs as ESM, so require() is unavailable here — only process.env.
# When the preflight fails the variable stays unset and `disabled` below turns
# this entry off (explicit safe-degrade) instead of loading the MCP server with
# an empty token.
- insert:
    - id: mcp-notion
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js "!process.env.NOTION_TOKEN"
      config:
        serverName: notion
        transport: stdio
        command: npx
        args: ['-y', '@notionhq/notion-mcp-server']
        env:
          NOTION_TOKEN: !!js "process.env.NOTION_TOKEN || ''"
        toolCallTimeoutMs: 120000
        failOnStartupError: false

# --- 用户体验优化（2026-08-14，可整体删除本段还原；需重启 dsh web 生效） ---

# 会话全文搜索：默认 openAt: never（全文搜索关闭，侧边栏搜索仅匹配标题）。
# 改为 first-search 后，侧边栏搜索框在首次搜索时才加载 node:sqlite 并建立
# 内存索引——启动保持安静（Node 22 无实验性警告），搜索即可命中会话正文。
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: first-search

# 系统提示词：官方 persona + 语言跟随 + 全局任务收资协议（覆盖未自带 persona 的预设；
# 自带 persona 的预设（standard/code/cordis/autonomous）由 ~/.dsh/AGENTS.md 全局指令覆盖）。
- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.
      Respond in the same language the user writes in; for Chinese users, reply in Chinese.

      TASK INTAKE PROTOCOL (global): treat plain-language task descriptions as drafts. Before
      executing, identify every unclear or missing detail — goal, scope, target files, constraints,
      preferences, credentials, deliverables, acceptance criteria, and anything the user forgot to
      mention — and confirm anything you are unsure about in ONE consolidated ask_user_question
      round (up to 8 questions with recommended options). Never ask what you can find out yourself.
      After the answers, execute fully autonomously without further check-ins; use the goal system
      for long-running tasks and report at the end.

# Agent 预设全局默认 = 自主执行（任务收资协议：先问清、后全程自主）。
# 自定义预设位于 ~/.dsh/.agent-presets/autonomous/。改回标准：default: standard
- id: agent-presets
  config:
    default: autonomous

