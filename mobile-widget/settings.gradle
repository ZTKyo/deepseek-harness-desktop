// DSH Watchdog Widget — 最小 Gradle build（R2 C；仅服务本 Widget APK）。
// 原则：不触碰 Harness 主工程 build；不建立第二 Harness build authority。
pluginManagement {
	repositories {
		google()
		mavenCentral()
		gradlePluginPortal()
	}
}
dependencyResolutionManagement {
	repositories {
		google()
		mavenCentral()
	}
}
rootProject.name = 'dsh-watchdog-widget'
include ':app'
