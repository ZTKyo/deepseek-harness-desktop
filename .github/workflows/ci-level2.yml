name: CI Level 2 - Windows Reliability State Machines

on:
  pull_request:
    branches: [main]
  push:
    branches: [reliability-v1]

jobs:
  state-machine-tests:
    name: Reliability state machine tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restart budget state machine
        shell: pwsh
        run: |
          $tmp = Join-Path $env:TEMP ("budget-" + [guid]::NewGuid().ToString('N') + '.json')
          $env:DSH_RESTART_BUDGET_PATH = $tmp
          . .\dsh-restart-budget.ps1
          # exhaust window budget
          1..3 | ForEach-Object { Register-DshRestartAttempt 'test' | Out-Null }
          $g = Test-DshRestartAllowed
          if ($g.Allowed) { throw 'budget should be exhausted after 3 attempts' }
          Write-Host "PASS budget exhausted: $($g.Reason)"
          # Phase 02 R2: success shortcut WITHOUT stable candidate must NOT reset
          Register-DshRestartSuccess | Out-Null
          $g1 = Test-DshRestartAllowed
          if ($g1.Allowed) { throw 'no-candidate success must NOT reset budget (strict stable-window)' }
          Write-Host 'PASS no-candidate success does not reset'
          # full stable-commit path resets
          # Phase 02 R5: candidate/commit require non-empty generation identity
          $env:DSH_RESTART_STABLE_WINDOW_SEC = '0'
          Register-DshRestartCandidate -AttemptId 'ci-gen' -ProcessId 4242 -Generation 'ci-gen-v1' | Out-Null
          $null = Confirm-DshRestartStable -AttemptId 'ci-gen' -ProcessId 4242 -Generation 'ci-gen-v1'
          $g2 = Test-DshRestartAllowed
          if (-not $g2.Allowed) { throw 'budget should reset after stable commit' }
          Write-Host 'PASS budget resets after stable commit'
          Remove-Item $tmp -Force -ErrorAction SilentlyContinue

      - name: Boot mode state machine
        shell: pwsh
        run: |
          $tmp = Join-Path $env:TEMP ("bm-" + [guid]::NewGuid().ToString('N') + '.json')
          $env:DSH_BOOT_MODE_PATH = $tmp
          . .\dsh-boot-mode.ps1
          if ((Get-DshBootMode).mode -ne 'normal') { throw 'default should be normal' }
          Set-DshBootMode -Mode safe -Reason 'ci-test' | Out-Null
          if ((Get-DshBootMode).mode -ne 'safe') { throw 'safe not persisted' }
          Reset-DshBootMode | Out-Null
          if ((Get-DshBootMode).mode -ne 'normal') { throw 'reset should return normal' }
          Write-Host 'PASS boot-mode state machine'
          Remove-Item $tmp -Force -ErrorAction SilentlyContinue

      - name: Safe Mode state machine (isolated)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\reliability\Test-StageE-SafeMode.ps1

      - name: Launcher argv preservation (no-open + trusted-host + boot-mode)
        shell: pwsh
        run: |
          node tests\reliability\Test-LauncherArgs.mjs

      - name: Last Good authority - guardian cannot syntax-only promote
        shell: pwsh
        run: |
          $src = Get-Content .\dsh-guardian.ps1 -Raw
          if ($src -match "if \(\`$ok -eq \`$true\)[^}]*Copy-Item \`$cf\.Path \`$lg") { throw 'guardian still promotes syntax-valid config!' }
          if ($src -notmatch 'restored mirror snapshot') { throw 'guardian mirror-restore branch missing' }
          Write-Host 'PASS guardian no syntax-only promote'

      - name: Diagnostics redaction
        shell: pwsh
        run: |
          $src = Get-Content .\dsh-diagnostics.ps1 -Raw
          if ($src -notmatch 'redact|mask|\*\*\*') { throw 'diagnostics has no redaction' }
          Write-Host 'PASS diagnostics redaction present'

      - name: Transaction checkpoint/restore + journal
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\reliability\Test-StageC-Transaction.ps1 -SkipLive

      - name: Reliability Lab L1
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File dsh-reliability-lab.ps1 -RunAll

      # Phase 02 R6 (R5-B6): production-path state machine regressions —
      # EC recovery bridge, capacity resolver, R5 addendum/refinement, and
      # LastGood required-set. These are the new R5/R6 key state machines.
      - name: EC recovery bridge + capacity resolver + R5 addendum (production path)
        shell: pwsh
        run: |
          node tests\reliability\test-ec-router-bridge.mjs
          node tests\reliability\test-capacity-resolver.mjs
          node tests\reliability\test-r5-addendum-ec.mjs
          node tests\reliability\test-model-registry.mjs
          node tests\reliability\test-completion-truth.mjs
          node tests\reliability\test-resume-defer.mjs

      # ── P2.6 R1/R2 semantic layer (Failure Taxonomy V1 + quota recovery) ──────
      # Per External Review Blocker B: quota-defer / network-error /
      # rollback-switch + commandcode + full-path integration live in the
      # Level 2 state-machine lane. All are pure node suites (no live server,
      # no credentials, repo-relative, self-contained harnesses).
      - name: P2.6 R1 quota defer (EC taxonomy defer + Router requirement bridge)
        shell: pwsh
        run: |
          node tests\continuity\verify-p26-r1-quota-defer.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "P26-R1-QUOTA-DEFER FAIL"; exit 1 }
          Write-Host "p26 r1 quota-defer: PASS"

      - name: P2.6 R1 network error (bounded retry, no fabricated status)
        shell: pwsh
        run: |
          node tests\continuity\verify-p26-r1-network-error.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "P26-R1-NETWORK-ERROR FAIL"; exit 1 }
          Write-Host "p26 r1 network-error: PASS"

      - name: P2.6 R1 rollback switch (EC_DISABLED OFF/ON + isolation)
        shell: pwsh
        run: |
          node tests\continuity\verify-p26-r1-rollback-switch.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "P26-R1-ROLLBACK-SWITCH FAIL"; exit 1 }
          Write-Host "p26 r1 rollback-switch: PASS"

      - name: P2.6 R2 commandcode quota cross-provider fallback (Blocker A)
        shell: pwsh
        run: |
          node tests\continuity\verify-p26-r2-commandcode-quota.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "P26-R2-COMMANDCODE-QUOTA FAIL"; exit 1 }
          Write-Host "p26 r2 commandcode-quota: PASS"

      - name: P2.6 R1.1 direct-provider quota full-path integration (Blocker A)
        # Real production modules only (execution-continuity.mjs + openrouter-router.mjs
        # + execution-continuity-core.mjs); request-error path drives the authority
        # transition (EC emits requirement -> router consumes + rewrites provider/model).
        # No credentials, no live server; sleeps a bounded ~30s per quota-triggered
        # backoff by design (verify-p26-r1-1-managed-direct-quota.mjs).
        shell: pwsh
        run: |
          node tests\continuity\verify-p26-r1-1-managed-direct-quota.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "P26-R1-1-DIRECT-QUOTA FAIL"; exit 1 }
          Write-Host "p26 r1.1 direct quota full-path: PASS"

      - name: P2.6 R1.2 quota no-alternative -> zero blind retry (A2 precise semantics)
        # A2: when the quota-exhausted provider is the ONLY compatible route, EC must
        # defer (WAITING_PROVIDER, nextRetryAt ≈ unavailableUntil) instead of blind
        # retrying; receipt consumed once, no busy loop, no session/event writes.
        # Repo-internal modules only (no official package, no credentials); bounded
        # ~60s runtime by design (one defer cycle).
        shell: pwsh
        run: |
          node tests\continuity\verify-p26-r1-2-quota-no-alternative.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "P26-R1-2-QUOTA-NO-ALTERNATIVE FAIL"; exit 1 }
          Write-Host "p26 r1.2 quota no-alternative: PASS"

      - name: Last Good required-set + atomic restore (isolated)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\reliability\Test-StageB-LastGoodAuthority.ps1 -SkipLive

      - name: Generation ID logic
        shell: pwsh
        run: |
          . .\dsh-generation.ps1
          $g = Get-DshGenerationId -Port 35998
          if ($null -ne $g) { Write-Host "WARN generation on dead port = $g (unexpected but non-fatal)" }
          Write-Host 'PASS generation id path executes'
