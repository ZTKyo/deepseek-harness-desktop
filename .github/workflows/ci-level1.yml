name: CI Level 1 - Static Gate (every PR)

on:
  pull_request:
    branches: [main]
  push:
    branches: [reliability-v1]

jobs:
  static-gate:
    name: Static + secret + syntax gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell syntax parse (all .ps1)
        shell: pwsh
        run: |
          $fail = 0
          Get-ChildItem -Recurse -Filter '*.ps1' | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs.Count -gt 0) {
              Write-Host "SYNTAX FAIL: $($_.FullName)"
              $errs | Select-Object -First 3 | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
              $script:fail = 1
            } else {
              Write-Host "OK: $($_.Name)"
            }
          }
          exit $fail

      - name: Node syntax parse (all .js/.mjs)
        shell: pwsh
        run: |
          $fail = 0
          Get-ChildItem -Recurse -Include '*.js','*.mjs' | Where-Object { $_.FullName -notmatch 'node_modules' } | ForEach-Object {
            node --check $_.FullName 2>$null
            if ($LASTEXITCODE -ne 0) { Write-Host "SYNTAX FAIL: $($_.FullName)"; $script:fail = 1 }
          }
          exit $fail

      - name: Context-memory unit regression (P2.5, T1-T11 incl. R2-7)
        shell: pwsh
        run: |
          # P2.5 R2 (R2-1): every PR must pass the context-memory unit suite
          # (MiniSession fold semantics, recall refs, restart recovery, bounded
          # memory, no-duplicate-authority, context rot, R2-7 blocker close).
          # Pure node unit test: no live server, no credentials, repo-relative.
          node tests\context-memory\verify-context-memory.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "CONTEXT-MEMORY REGRESSION FAIL"; exit 1 }
          Write-Host "context-memory unit regression: PASS"

      - name: Final semantic NEG regression (P2.5 R5.1, synthetic 10-case dual-gate)
        shell: pwsh
        run: |
          # R5.1: the recall dual-gate (strict × semantic) must reject every
          # artifact class flagged in external review (injection-wrapped goal,
          # error-record without error evidence, todo noise dressed as file
          # evidence, prose paths, missing chain tail) while legal provenance
          # still passes. Pure synthetic fixtures: zero live data, zero
          # credentials, repo-relative, self-contained imports.
          node docs\roadmap\evidence\make-r5-recall-final-neg.mjs neg-ci-out
          if ($LASTEXITCODE -ne 0) { Write-Host "FINAL SEMANTIC NEG FAIL"; exit 1 }
          Write-Host "final semantic NEG regression: 10/10 PASS"

      - name: Install-plugin regression (P2.5 R2-2 atomic write + auto hash check)
        shell: pwsh
        run: |
          # P2.5 R2-2: the authoritative installer must (a) copy atomically
          # (tmp+rename, no half-written plugin), (b) auto-discover mount refs
          # and hash-check targets even with no --plugin, (c) integrate with the
          # restart preflight. Temp dirs only -- never touches ~/.dsh.
          npm install -g js-yaml
          if ($LASTEXITCODE -ne 0) { Write-Host "npm install js-yaml FAILED"; exit 1 }
          node tests\install-plugin\verify-install-plugin.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "INSTALL-PLUGIN REGRESSION FAIL"; exit 1 }
          Write-Host "install-plugin regression: PASS"

      - name: Guardian !!js YAML regression (P2.5 R2-8 behavioral)
        shell: pwsh
        run: |
          # R2-8: guardian's Test-YamlFile must treat !!js-tagged configs as VALID
          # (not INVALID, which would roll back guardian-lastgood). Source-integrity
          # + behavioral: extracts guardian's real probe code and runs it against
          # isolated fixtures. Cross-checks real ~/.dsh configs if present.
          # js-yaml must exist for the extracted probe to run: install it WITHOUT
          # swallowing failures (a silent npm failure leaves the probe with no
          # js-yaml), and export NODE_PATH=(npm root -g) like the YAML-parse gate.
          npm install -g js-yaml
          if ($LASTEXITCODE -ne 0) { Write-Host "npm install js-yaml FAILED"; exit 1 }
          $env:NODE_PATH = (npm root -g)
          node tests\reliability\verify-guardian-js-tag.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "GUARDIAN !!JS REGRESSION FAIL"; exit 1 }
          Write-Host "guardian !!js regression: PASS"

      - name: YAML parse (all .yml/.yaml, cordis !!js aware)
        shell: pwsh
        run: |
          npm install -g js-yaml 2>&1 | Out-Null
          $env:NODE_PATH = (npm root -g)   # global modules must be resolvable
          # cordis patch layers legitimately use the `!!js` scalar tag, so the
          # checker parses with a loader-compatible schema; a DEFAULT-schema
          # parse would report a FALSE "unknown scalar tag" failure.
          node tests\reliability\yaml-parse-check.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "YAML PARSE GATE FAIL"; exit 1 }

      # ── P4 LEARN AC10: gate-existence gate (no silently missing/excluded gate) ──
      # Why L1: it is a static, data-free check over the repo's own files, so it must
      # run on EVERY PR, not only in the learn lane. It answers one question that has
      # repeatedly gone wrong: "is every suite in this subsystem actually owned by
      # something that runs it?" tests/learn/gate-registry.json is the single ledger
      # (kind / CI wiring / required real data / exclusion reason / local command);
      # the validator fails closed when a suite is unregistered, when a registered CI
      # gate is not actually invoked by the named step, when an exclusion has no
      # reason, when a workflow YAML does not parse, or when STAGE_DELEGATION points
      # at a workflow that does not run the gate it claims (the old false-green
      # pointer: ISOLATED_TESTS -> ci-level1.yml, a lane that runs no isolated tests).
      - name: P4 LEARN gate registry (no silently-missing / silently-excluded gate)
        shell: pwsh
        run: |
          npm install -g js-yaml 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "npm install js-yaml FAILED"; exit 1 }
          $env:NODE_PATH = (npm root -g)
          node tests\learn\validate-gate-registry.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "AC10 GATE REGISTRY FAIL"; exit 1 }
          Write-Host "AC10 gate registry: PASS"

      # The registry gate above is itself a gate: this step proves it can actually
      # turn red. Six real defects are injected into a temp copy (unregistered suite,
      # falsely-claimed CI gate, emptied exclusion reason, false-green delegation
      # pointer, broken workflow YAML, unregistered wiring) and EACH one must make the
      # corresponding numbered check fail — after first proving the unmutated copy is
      # green (otherwise the red would be tautological).
      - name: P4 LEARN AC10 registry mutation proof (registry gate must turn RED)
        shell: pwsh
        run: |
          $env:NODE_PATH = (npm root -g)
          node tests\learn\_ac10-registry-mutation-proof.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "AC10 REGISTRY MUTATION PROOF FAIL"; exit 1 }
          Write-Host "AC10 registry mutation proof: PASS"

      - name: Secret / private-key scan (must block)
        shell: pwsh
        run: |
          $fail = 0
          $patterns = @(
            '(?i)(api[_-]?key|secret|token|password|passwd|private[_-]?key)\s*[:=]\s*["''][A-Za-z0-9_\-]{16,}["'']',
            '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----',
            'sk-[A-Za-z0-9]{20,}',
            'ghp_[A-Za-z0-9]{20,}',
            'AKIA[0-9A-Z]{16}'
          )
          Get-ChildItem -Recurse -File | Where-Object { $_.FullName -notmatch 'node_modules|\.git\\|\.github\\' } | ForEach-Object {
            $c = Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue
            foreach ($p in $patterns) {
              if ($c -match $p) {
                Write-Host "SECRET SCAN FAIL: $($_.FullName) matched $p"
                $script:fail = 1
              }
            }
          }
          exit $fail

      - name: Secret scan (node secret-scan-check, second layer) + FAIL/PASS fixture proof
        shell: pwsh
        run: |
          # SH-R2-3: repo-wide node scanner as a SECOND layer on top of the
          # PowerShell pattern scan above. Every PR must run BOTH.
          node tests\reliability\secret-scan-check.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "SECRET-SCAN-CHECK FAIL"; exit 1 }
          Write-Host "secret-scan-check (repo): PASS"
          # Fixture proof: real-looking secret must FAIL, ${ENV} template must PASS,
          # exemption must be exact-literal (prefix-sharing key still FAILS).
          node tests\reliability\test-secret-scan-fixtures.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "SECRET-SCAN FIXTURE PROOF FAIL"; exit 1 }
          Write-Host "secret-scan fixture proof: PASS"

      - name: Credential preflight / safe-degrade negative tests (SH-R2-4)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\reliability\Test-CredentialPreflight.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "CREDENTIAL PREFLIGHT TEST FAIL"; exit 1 }
          Write-Host "credential preflight negative tests: PASS"

      - name: Cold-start credential gate (SH-R3-1, contract-only in CI; live run is the release gate)
        shell: pwsh
        run: |
          # In CI we run the orchestration contract (deployed patch has the
          # safe-degrade expression, starter preflights, audit log exists).
          # The REAL three-phase cold boot (negative -> restore -> normal) is a
          # release/runtime gate executed on the live machine (see REPORT_SH_R3).
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\reliability\Test-ColdStartCredentialGate.ps1 -SkipLive
          if ($LASTEXITCODE -ne 0) { Write-Host "COLD-START CREDENTIAL GATE CONTRACT FAIL"; exit 1 }
          Write-Host "cold-start credential gate contract: PASS"

      - name: .gitignore assertions
        shell: pwsh
        run: |
          $gi = Get-Content .gitignore -Raw
          $need = @('\*\.pem','\*\.key','\.credentials\.yaml','secrets/','\.env')
          $fail = 0
          foreach ($n in $need) {
            if ($gi -notmatch $n) { Write-Host "GITIGNORE MISSING: $n"; $script:fail = 1 }
          }
          exit $fail

      - name: Roadmap status document integrity (UTF-8, no NUL/control chars)
        shell: pwsh
        run: |
          $f = 'docs/roadmap/CURRENT_STATUS.md'
          if (-not (Test-Path $f)) { Write-Host "MISSING: $f"; exit 1 }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $f))
          $nul = ($bytes | Where-Object { $_ -eq 0 }).Count
          if ($nul -gt 0) { Write-Host "FAIL: CURRENT_STATUS.md contains $nul NUL bytes"; exit 1 }
          $text = [System.IO.File]::ReadAllText((Resolve-Path $f), [System.Text.Encoding]::UTF8)
          $ctrl = [regex]::Matches($text, "[\x00-\x08\x0B\x0C\x0E-\x1F]")
          if ($ctrl.Count -gt 0) { Write-Host "FAIL: CURRENT_STATUS.md contains $($ctrl.Count) control chars"; exit 1 }
          Write-Host "PASS: CURRENT_STATUS.md UTF-8 clean (NUL=0, control=0)"

      - name: Module import smoke (dot-source pure modules into a fresh pwsh)
        shell: pwsh
        run: |
          # runner scripts with their own main-loop body are not dot-sourceable;
          # test only pure modules (function libraries).
          $skip = @('dsh-guardian.ps1','dsh-guardian-watchdog.ps1','dsh-diagnostics.ps1','dsh-healthcheck.ps1','dsh-vps-tunnel-loop.ps1','dsh-reliability-lab.ps1','dsh-clean-reclaim.ps1','dsh-plugin-transaction.ps1','DSH-Client.ps1','DSH-Harness-PS.ps1','dsh-safe-mode.ps1','dsh-power-lease.ps1')
          $fail = 0
          foreach ($f in (Get-ChildItem -Filter 'dsh-*.ps1')) {
            if ($f.Name -in $skip) { Write-Host "SKIP (runner script): $($f.Name)"; continue }
            try {
              & powershell -NoProfile -Command ". '$($f.FullName)'" 2>&1 | Out-Null
              if ($LASTEXITCODE -eq 0) { Write-Host "IMPORT OK: $($f.Name)" } else { Write-Host "IMPORT FAIL: $($f.Name)"; $script:fail = 1 }
            } catch { Write-Host "IMPORT FAIL: $($f.Name) - $($_.Exception.Message)"; $script:fail = 1 }
          }
          exit $fail

      - name: Stage B authority test (isolated, no live server)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\reliability\Test-StageB-LastGoodAuthority.ps1 -LivePort 35999 -SkipLive

      - name: Stage D boot-mode test
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\reliability\Test-StageD-BootMode.ps1

      - name: Stage E safe-mode isolated test
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\reliability\Test-StageE-SafeMode.ps1

      - name: Reliability Lab Level 1 (synthetic faults)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File dsh-reliability-lab.ps1 -RunAll

      - name: Stage C transaction state machine (isolated)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\reliability\Test-StageC-Transaction.ps1 -LivePort 35999 -SkipLive

      - name: OpenRouter exact-model preservation tests (pure, no live server)
        shell: pwsh
        run: |
          node tests\router\test-exact-model-preservation.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "EXACT-MODEL TEST FAIL"; exit 1 }
          Write-Host "exact-model preservation: 9/9 PASS"

      - name: DeepSeek native multimodal tests (pure, no live server)
        shell: pwsh
        run: |
          node tests\router\test-deepseek-native-multimodal.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "MULTIMODAL TEST FAIL"; exit 1 }
          Write-Host "deepseek native multimodal: PASS"

      - name: Router deploy rollback tests (isolated, cross-process)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\router\Test-RouterDeployRollback.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "ROLLBACK TEST FAIL"; exit 1 }
          Write-Host "router deploy rollback: PASS"

      # ── P2.6 R1/R2 semantic layer (Failure Taxonomy V1 + quota recovery) ──────
      # Pure node unit/integration suites: no live server, no credentials,
      # repo-relative, self-contained harnesses. Per External Review Blocker B:
      # L1 carries ONLY the pure-unit failure classifier; quota-defer /
      # network-error / rollback-switch / commandcode / full-path integration
      # live in Level 2 (state-machine lane) — see ci-level2.yml.
      - name: P2.6 R1 failure taxonomy classifier (Failure Taxonomy V1, pure unit)
        shell: pwsh
        run: |
          node tests\reliability\test-failure-classifier-v1.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "FAILURE-CLASSIFIER TEST FAIL"; exit 1 }
          Write-Host "failure classifier v1: PASS"

      # ─── P2.75 SUPERVISOR (R1.1, External Review Round 2 Blocker C) ───────────
      # L1 carries ONLY the pure-unit supervisor core/tool-surface suite (zero
      # deps, no server, no dsh install). Integration/mutation suites live on
      # L2; the isolated real-instance E2E lives on L3 — see ci-level2.yml /
      # ci-level3.yml.
      - name: P2.75 Supervisor core/tool-surface unit tests (T1-T30, pure unit)
        shell: pwsh
        run: |
          node plugins\supervisor-bridge-test.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "P275 SUPERVISOR CORE TEST FAIL"; exit 1 }
          Write-Host 'P2.75 supervisor core/tool-surface unit tests: PASS'

      # ─── P4 EXTERNAL REVIEW D1 GATES (2026-10-01) ─────────────────────────────
      # D1 turned "one current status per audited baseline" into two machine
      # checks instead of a prose promise:
      #   (a) parity -- the roadmap status index (docs/roadmap/P4_STATUS.json)
      #       must agree with the authority document in BOTH directions, every
      #       registered historical document must carry the staleness marker,
      #       and no unregistered document may repeat a superseded headline;
      #   (b) verbatim history -- for every registered document, each non-empty
      #       line of the HEAD revision must still be a strict PREFIX of a
      #       working-tree line ("annotate, never rewrite").
      # Both are pure node, repo-relative and read-only (no network, no creds).
      # Authority on conflict: docs/roadmap/CURRENT_STATUS.md.
      #
      # NOTE (D4, recorded not fixed): tests/roadmap is NOT listed in the
      # ci-level3 `paths:` filter, and plugins/*.mjs only matches one level.
      # A pull request touching ONLY such files would never start L3, so the
      # required context "DSH boot + readiness smoke" would never be reported.
      # See docs/roadmap/reports/PHASE_04_LEARNING/R3_FINAL_CLOSURE/evidence/
      # D3_D4_MERGE_GATE_GOVERNANCE_20261001.md.
      - name: P4 roadmap status parity gate (D1)
        shell: pwsh
        run: |
          node tests\roadmap\validate-p4-status-consistency.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "P4 STATUS CONSISTENCY FAIL"; exit 1 }

      - name: P4 history preservation gate (D1)
        shell: pwsh
        run: |
          node tests\roadmap\verify-history-preserved.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "HISTORY PRESERVATION FAIL"; exit 1 }

      - name: Finding A controls (per-AC verdict consistency must be enforceable, not decorative)
        shell: pwsh
        run: |
          # Finding A: the per-AC status rows were only a prose promise. This control runs the
          # REAL parity gate against a throwaway copy of the tree and asserts 11 cases:
          # a legitimate synchronised change stays GREEN (A0/A7) while ten real tamperings
          # (index/authority disagree, missing AC row, unknown AC key, illegal verdict token,
          # summary still claiming all-PASS) each turn it RED on the *specific* numbered check.
          # The copy is `git init`-ed with one commit on purpose: the anchor gate proves what is
          # history via `git show HEAD:<file>`, and without a HEAD the baseline would be red for
          # an unrelated reason — every RED case would then pass for the wrong reason (false green).
          node tests\roadmap\test-p4-status-per-ac-consistency.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "FINDING A PER-AC CONTROLS FAIL"; exit 1 }

      - name: Finding B controls (release-artifact verdict must depend on content, not on the checkout)
        shell: pwsh
        run: |
          # Finding B (R1 external review, reproduced on one commit): the release-artifact
          # verifier answered IDENTICAL in an LF checkout and DRIFT in a CRLF checkout. This
          # control runs the REAL verifier against byte-controlled variants of the REAL artifact
          # in a throwaway copy: LF/CRLF/CR/mixed/cross-file EOL variants must all exit 0, while
          # nine real content drifts (body, deleted section, non-EOL whitespace, stale/missing/
          # malformed/self-conflicting header hashes, extra trailing newline) must exit 1.
          node tests\roadmap\test-release-artifact-verifier.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "FINDING B RELEASE-ARTIFACT CONTROLS FAIL"; exit 1 }

      - name: P4 document anchor gate (D - hand-written line pointers must not come back)
        shell: pwsh
        run: |
          # Finding D: a hand-written pointer like `L33` drifts when the document changes
          # (measured: +34 lines) and nothing notices. Line numbers are derived data.
          # This gate resolves every registered anchor (fail-closed if one disappears) and
          # rejects NEW hand-written line pointers inside the registered ban blocks
          # (append-only history lines are exempt, judged against `git show HEAD:<file>`).
          node tools\check-doc-anchors.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "DOC ANCHOR GATE FAIL"; exit 1 }
          # Scope is reported, not hidden: the census is heuristic and informational only.
          node tools\check-doc-anchors.mjs --census

      - name: P4 document anchor gate NEGATIVE CONTROL (the ban must be able to turn red)
        shell: pwsh
        run: |
          # A gate that can never fail is decoration. This test builds a throwaway fixture
          # plus a throwaway registry in a temp dir (it never touches repo documents) and
          # asserts three cases: bare new line pointer => RED, anchor-bearing => GREEN,
          # pointer outside the banned block => not flagged.
          node tests\roadmap\test-anchor-gate-negative-control.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "ANCHOR GATE NEGATIVE CONTROL FAIL"; exit 1 }

      - name: Finding E NEGATIVE CONTROL (the "point value, not a constant" rule must be able to turn red)
        shell: pwsh
        run: |
          # External Review Finding E was about an unqualified number, so the fix is a written
          # qualification plus an assertion (validator H2/H5). This control proves those two
          # assertions are falsifiable WITHOUT touching repo files: it copies the tree to a temp
          # mirror (git init + one commit so the anchor gate's frozen-line exemption still works),
          # checks the mirror baseline is green, then injects the E defect class twice
          # (drop the "not a constant" qualifier; falsify the census fixture expectation) and
          # requires H5 / H2 to flip PASS -> FAIL, then restore and require them green again.
          node tests\roadmap\test-finding-e-negative-control.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "FINDING E NEGATIVE CONTROL FAIL"; exit 1 }

      - name: Finding C NEGATIVE CONTROL (the question answered with 43) must be able to turn red
        shell: pwsh
        run: |
          # External Review Finding C was: the authority document's self-reported numbers
          # (43 assertions / 1420 lines / 55 exemptions) were stale AND no gate pinned them.
          # The fix (validator I1/I2/I3) makes the numbers machine-recomputed. This control proves
          # those assertions are falsifiable WITHOUT touching repo files: it mirrors the tree to a
          # temp dir (git init + one commit), requires a green baseline, then injects three defect
          # forms one at a time - stale assertion count (I2), stale HEAD-line count (I3), and the
          # declaration line deleted outright (I1 fail-closed) - and requires the matching
          # assertion to flip PASS -> FAIL, then restore and require green again.
          node tests\roadmap\test-finding-c-number-pinning.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "FINDING C NEGATIVE CONTROL FAIL"; exit 1 }

      - name: Release artifact integrity (named copy must equal the authoritative body)
        shell: pwsh
        run: |
          # External Review Finding G: this verifier was the ONLY credential behind the
          # "release artifact is identical" claim, yet no workflow invoked it - the claim was
          # local-only. It is read-only and sub-second, so it belongs in the required gate.
          # Verdict is EOL-normalised (Finding B): the same content judged IDENTICAL on LF and
          # CRLF checkouts; real content drift still reports DRIFT and exits 1.
          node tools\verify-release-artifact.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "RELEASE ARTIFACT DRIFT"; exit 1 }

      - name: Release artifact verifier NEGATIVE CONTROL (the verdict must be able to turn red)
        shell: pwsh
        run: |
          # Finding G, control half: the verifier must be falsifiable, and it must NOT be
          # falsifiable by line-ending configuration alone (that was Finding B's blocker).
          # The control runs against temp copies only: body drift => DRIFT/exit 1,
          # stale header hash => DRIFT/exit 1, LF vs CRLF of identical content => IDENTICAL/exit 0,
          # restore => IDENTICAL/exit 0.
          node tests\roadmap\test-release-artifact-verifier.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "RELEASE ARTIFACT VERIFIER CONTROL FAIL"; exit 1 }
