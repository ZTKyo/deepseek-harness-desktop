name: CI Level 1 - Static Gate (every PR)

on:
  pull_request:
    branches: [main]
  push:
    branches: [reliability-v1]

jobs:
  static-gate:
    name: Static + secret + syntax gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell syntax parse (all .ps1)
        shell: pwsh
        run: |
          $fail = 0
          Get-ChildItem -Recurse -Filter '*.ps1' | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs.Count -gt 0) {
              Write-Host "SYNTAX FAIL: $($_.FullName)"
              $errs | Select-Object -First 3 | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
              $script:fail = 1
            } else {
              Write-Host "OK: $($_.Name)"
            }
          }
          exit $fail

      - name: Node syntax parse (all .js/.mjs)
        shell: pwsh
        run: |
          $fail = 0
          Get-ChildItem -Recurse -Include '*.js','*.mjs' | Where-Object { $_.FullName -notmatch 'node_modules' } | ForEach-Object {
            node --check $_.FullName 2>$null
            if ($LASTEXITCODE -ne 0) { Write-Host "SYNTAX FAIL: $($_.FullName)"; $script:fail = 1 }
          }
          exit $fail

      - name: Context-memory unit regression (P2.5, T1-T11 incl. R2-7)
        shell: pwsh
        run: |
          # P2.5 R2 (R2-1): every PR must pass the context-memory unit suite
          # (MiniSession fold semantics, recall refs, restart recovery, bounded
          # memory, no-duplicate-authority, context rot, R2-7 blocker close).
          # Pure node unit test: no live server, no credentials, repo-relative.
          node tests\context-memory\verify-context-memory.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "CONTEXT-MEMORY REGRESSION FAIL"; exit 1 }
          Write-Host "context-memory unit regression: PASS"

      - name: Install-plugin regression (P2.5 R2-2 atomic write + auto hash check)
        shell: pwsh
        run: |
          # P2.5 R2-2: the authoritative installer must (a) copy atomically
          # (tmp+rename, no half-written plugin), (b) auto-discover mount refs
          # and hash-check targets even with no --plugin, (c) integrate with the
          # restart preflight. Temp dirs only -- never touches ~/.dsh.
          npm install -g js-yaml 2>&1 | Out-Null
          node tests\install-plugin\verify-install-plugin.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "INSTALL-PLUGIN REGRESSION FAIL"; exit 1 }
          Write-Host "install-plugin regression: PASS"

      - name: Guardian !!js YAML regression (P2.5 R2-8 behavioral)
        shell: pwsh
        run: |
          # R2-8: guardian's Test-YamlFile must treat !!js-tagged configs as VALID
          # (not INVALID, which would roll back guardian-lastgood). Source-integrity
          # + behavioral: extracts guardian's real probe code and runs it against
          # isolated fixtures. Cross-checks real ~/.dsh configs if present.
          node tests\reliability\verify-guardian-js-tag.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "GUARDIAN !!JS REGRESSION FAIL"; exit 1 }
          Write-Host "guardian !!js regression: PASS"

      - name: YAML parse (all .yml/.yaml, cordis !!js aware)
        shell: pwsh
        run: |
          npm install -g js-yaml 2>&1 | Out-Null
          $env:NODE_PATH = (npm root -g)   # global modules must be resolvable
          # cordis patch layers legitimately use the `!!js` scalar tag, so the
          # checker parses with a loader-compatible schema; a DEFAULT-schema
          # parse would report a FALSE "unknown scalar tag" failure.
          node tests\reliability\yaml-parse-check.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "YAML PARSE GATE FAIL"; exit 1 }

      - name: Secret / private-key scan (must block)
        shell: pwsh
        run: |
          $fail = 0
          $patterns = @(
            '(?i)(api[_-]?key|secret|token|password|passwd|private[_-]?key)\s*[:=]\s*["''][A-Za-z0-9_\-]{16,}["'']',
            '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----',
            'sk-[A-Za-z0-9]{20,}',
            'ghp_[A-Za-z0-9]{20,}',
            'AKIA[0-9A-Z]{16}'
          )
          Get-ChildItem -Recurse -File | Where-Object { $_.FullName -notmatch 'node_modules|\.git\\|\.github\\' } | ForEach-Object {
            $c = Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue
            foreach ($p in $patterns) {
              if ($c -match $p) {
                Write-Host "SECRET SCAN FAIL: $($_.FullName) matched $p"
                $script:fail = 1
              }
            }
          }
          exit $fail

      - name: Secret scan (node secret-scan-check, second layer) + FAIL/PASS fixture proof
        shell: pwsh
        run: |
          # SH-R2-3: repo-wide node scanner as a SECOND layer on top of the
          # PowerShell pattern scan above. Every PR must run BOTH.
          node tests\reliability\secret-scan-check.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "SECRET-SCAN-CHECK FAIL"; exit 1 }
          Write-Host "secret-scan-check (repo): PASS"
          # Fixture proof: real-looking secret must FAIL, ${ENV} template must PASS,
          # exemption must be exact-literal (prefix-sharing key still FAILS).
          node tests\reliability\test-secret-scan-fixtures.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "SECRET-SCAN FIXTURE PROOF FAIL"; exit 1 }
          Write-Host "secret-scan fixture proof: PASS"

      - name: Credential preflight / safe-degrade negative tests (SH-R2-4)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\reliability\Test-CredentialPreflight.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "CREDENTIAL PREFLIGHT TEST FAIL"; exit 1 }
          Write-Host "credential preflight negative tests: PASS"

      - name: Cold-start credential gate (SH-R3-1, contract-only in CI; live run is the release gate)
        shell: pwsh
        run: |
          # In CI we run the orchestration contract (deployed patch has the
          # safe-degrade expression, starter preflights, audit log exists).
          # The REAL three-phase cold boot (negative -> restore -> normal) is a
          # release/runtime gate executed on the live machine (see REPORT_SH_R3).
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\reliability\Test-ColdStartCredentialGate.ps1 -SkipLive
          if ($LASTEXITCODE -ne 0) { Write-Host "COLD-START CREDENTIAL GATE CONTRACT FAIL"; exit 1 }
          Write-Host "cold-start credential gate contract: PASS"

      - name: .gitignore assertions
        shell: pwsh
        run: |
          $gi = Get-Content .gitignore -Raw
          $need = @('\*\.pem','\*\.key','\.credentials\.yaml','secrets/','\.env')
          $fail = 0
          foreach ($n in $need) {
            if ($gi -notmatch $n) { Write-Host "GITIGNORE MISSING: $n"; $script:fail = 1 }
          }
          exit $fail

      - name: Roadmap status document integrity (UTF-8, no NUL/control chars)
        shell: pwsh
        run: |
          $f = 'docs/roadmap/CURRENT_STATUS.md'
          if (-not (Test-Path $f)) { Write-Host "MISSING: $f"; exit 1 }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $f))
          $nul = ($bytes | Where-Object { $_ -eq 0 }).Count
          if ($nul -gt 0) { Write-Host "FAIL: CURRENT_STATUS.md contains $nul NUL bytes"; exit 1 }
          $text = [System.IO.File]::ReadAllText((Resolve-Path $f), [System.Text.Encoding]::UTF8)
          $ctrl = [regex]::Matches($text, "[\x00-\x08\x0B\x0C\x0E-\x1F]")
          if ($ctrl.Count -gt 0) { Write-Host "FAIL: CURRENT_STATUS.md contains $($ctrl.Count) control chars"; exit 1 }
          Write-Host "PASS: CURRENT_STATUS.md UTF-8 clean (NUL=0, control=0)"

      - name: Module import smoke (dot-source pure modules into a fresh pwsh)
        shell: pwsh
        run: |
          # runner scripts with their own main-loop body are not dot-sourceable;
          # test only pure modules (function libraries).
          $skip = @('dsh-guardian.ps1','dsh-guardian-watchdog.ps1','dsh-diagnostics.ps1','dsh-healthcheck.ps1','dsh-vps-tunnel-loop.ps1','dsh-reliability-lab.ps1','dsh-clean-reclaim.ps1','dsh-plugin-transaction.ps1','DSH-Client.ps1','DSH-Harness-PS.ps1','dsh-safe-mode.ps1','dsh-power-lease.ps1')
          $fail = 0
          foreach ($f in (Get-ChildItem -Filter 'dsh-*.ps1')) {
            if ($f.Name -in $skip) { Write-Host "SKIP (runner script): $($f.Name)"; continue }
            try {
              & powershell -NoProfile -Command ". '$($f.FullName)'" 2>&1 | Out-Null
              if ($LASTEXITCODE -eq 0) { Write-Host "IMPORT OK: $($f.Name)" } else { Write-Host "IMPORT FAIL: $($f.Name)"; $script:fail = 1 }
            } catch { Write-Host "IMPORT FAIL: $($f.Name) - $($_.Exception.Message)"; $script:fail = 1 }
          }
          exit $fail

      - name: Stage B authority test (isolated, no live server)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\reliability\Test-StageB-LastGoodAuthority.ps1 -LivePort 35999 -SkipLive

      - name: Stage D boot-mode test
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\reliability\Test-StageD-BootMode.ps1

      - name: Stage E safe-mode isolated test
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\reliability\Test-StageE-SafeMode.ps1

      - name: Reliability Lab Level 1 (synthetic faults)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File dsh-reliability-lab.ps1 -RunAll

      - name: Stage C transaction state machine (isolated)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\reliability\Test-StageC-Transaction.ps1 -LivePort 35999 -SkipLive

      - name: OpenRouter exact-model preservation tests (pure, no live server)
        shell: pwsh
        run: |
          node tests\router\test-exact-model-preservation.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "EXACT-MODEL TEST FAIL"; exit 1 }
          Write-Host "exact-model preservation: 9/9 PASS"

      - name: DeepSeek native multimodal tests (pure, no live server)
        shell: pwsh
        run: |
          node tests\router\test-deepseek-native-multimodal.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "MULTIMODAL TEST FAIL"; exit 1 }
          Write-Host "deepseek native multimodal: PASS"

      - name: Router deploy rollback tests (isolated, cross-process)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\router\Test-RouterDeployRollback.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "ROLLBACK TEST FAIL"; exit 1 }
          Write-Host "router deploy rollback: PASS"
