# --- Execution Continuity（execution-continuity，2026-08-23 crash-safe 重注册）---
# 事故复盘（2026-08-23 00:12 crash-loop，详见 EXECUTION_CONTINUITY_CRASHSAFE_REPORT.md）：
#   旧版 inject 声明 ["agents","goals","sessions","compaction"]，把 compaction 当成
#   boot 期硬依赖；web profile 的 host 平面 compaction-basic 被 web-app 层禁用
#   （disabled: true），Cordis assertEntriesActivated 发现 entry 永远 PENDING
#   （waiting for service: compaction）→ 整个 Host boot throw → 每 21~95 秒循环退出。
# Crash-Safe 设计（全部在 Plugin 层，不改官方 Core）：
#   1) inject 只保留 agents/goals/sessions（web host 平面真实存在的服务）；
#   2) compaction 改为运行时惰性探测（getCompaction：ctx.get 优先，属性访问兜底），
#      缺失 → 仅 contextOverflowRecovery 降级（COMPACTION_UNAVAILABLE），Server 照常启动；
#   3) 所有 handler/boot 均带异常隔离，任何内部错误只记录，绝不逃逸到 Host 顶层；
#   4) Active Mode（2026-08-23 晚升级，enableAutoResume: true）：
#      启用被动能力（分类+有界 retry/fallback）+ 主动恢复（boot scan / timer / turn-end
#      补位自动 resume）。anti-double-kick：resume 前检查 session.list 的 running 标志，
#      已 running 的 goal 跳过（与 goal-recovery.mjs 的 ledger claim + grace-verify 正交，
#      避免双 kick）；WAITING_USER/USER_PAUSED/USER_CANCELLED/COMPLETED/FAILED_FATAL
#      永不自动恢复。
# 删除本段即还原（插件进入 QUARANTINED：源码保留，注册禁用）。
- insert:
    - id: execution-continuity
      name: './execution-continuity.mjs'
      config:
        enableAutoResume: true
