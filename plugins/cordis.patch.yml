# --- Command Code 双模型路由（commandcode-router，2026-08-20）---
# 只拦截 provider=commandcode 的请求，把 auto / 具体模型统一决策成本次真正要发的模型：
#   默认主力 = meta/muse-spark-1.2-contributor（Muse Spark 1.2 Contributor）
#   单跳 fallback = deepseek/deepseek-v4-flash（DeepSeek V4 Flash），双向互为 fallback
# 关键保证（修复"一次自动回落后整个会话被锁死"的粘滞 bug）：
#   1) 状态拆成 preferredModel（用户意图）/ requestModel（本次请求）；
#      自动回落只写内存里的 armedFallback / temporaryPrimary，
#      绝不写 settings.yaml、会话默认、持久化模型选择；
#   2) 每个 turn 结构性复位 → 下一个新任务自动重新优先 Muse，不需要新建对话；
#   3) 每个 turn 最多一次跨模型回落，回落后再失败就如实报错（防乒乓）；
#   4) 手动切换优先级最高，并清除陈旧的自动回落状态。
# 决策逻辑在纯函数 core（commandcode-router-core.mjs），回归测试
# commandcode-router-test.mjs（51 项，含 T5/T6/T7 与 30 轮防粘滞压力测试）。
# 不干预 openrouter / opencode / xiaomi / agentrouter 等其他 provider 的既有行为。
# 与 settings.yaml 的 llm-pi-ai.providers.commandcode 配套。
# 可选：环境变量 CMD_ZDR=1 时为 api.commandcode.ai 注入 x-cmd-zdr: 1（默认关闭，
# 因为本 Harness 目前没有全局 ZDR/No-Training 设置，不擅自开启）。
# --- 全局 HTTP Keep-Alive 延长（keepalive-patch，2026-08-20）---
# Node 22 默认 keepAliveTimeout 仅 4 秒：每次对话间隔 >4 秒就会重建 TCP/TLS，
# 导致 Fake-IP 隧道下首次请求多付 ~800ms 冷启动代价（实测：COLD 1042ms vs WARM 217ms，
# 6 秒空闲后回落到 1478ms）。本补丁将 keepAliveTimeout 延长到 60 秒，
# 让"刚刚聊过接着问"的连接持续复用，直到长时间空闲才重建。
# 仅调整连接复用时长，不改路由/认证/TLS验证/代理/模型选择；删除本段即还原。
# 验证：打补丁后 6 秒空闲仍保持 258ms（原 1478ms），10 秒后 287ms。
- insert:
    - id: keepalive-patch
      name: './keepalive-patch.mjs'
      config: {}

