name: CI Level 3 - Harness Smoke (current version + sanitized profile)

on:
  pull_request:
    branches: [main]
    paths:
      - 'dsh-*.ps1'
      - 'dsh-*.js'
      - 'start-dsh-server.ps1'
      - 'dsh-launcher.js'
      - 'plugins/*.mjs'
      - 'cordis.patch.yml'
      - 'tests/context-memory/*'
      - 'tests/install-plugin/*'
      - 'tests/reliability/*'
      - 'tests/continuity/*'
      - 'tests/supervisor/*'
      - 'tests/fixtures/*'
      # P4 LEARN AC10 (2026-09-29): L3 now really runs the learn isolated-real-instance
      # gate (test-learn-ac6-real-promotion-e2e.mjs) and its registry cross-check, so a
      # change under tests/learn must trigger this lane — otherwise the very gate that
      # guards the learn subsystem would not run on learn changes.
      - 'tests/learn/*'
      - 'tests/rh1-tests.ps1'
      - 'tests/dsh-disposable-server.ps1'
      - 'tools/install-plugin.mjs'
      - 'docs/roadmap/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  smoke:
    name: DSH boot + readiness smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dsh (current supported version; not rc.8)
        shell: pwsh
        run: |
          # Phase 02 R4 (Step 10): use the CURRENT supported DSH version, not a
          # stale rc.8, so the release smoke proves the real runtime.
          $ver = '0.1.1-rc.2'
          npm install -g "@deepseek-ai/dsh@$ver" 2>&1 | Select-Object -Last 2
          dsh --version

          # ==========================================================================
          # AC10 ROOT CAUSE (2026-09-29, proven by the diag step below):
          # dsh@0.1.1-rc.2 declares "@deepseek-ai/cordis-plugin-hmr": "^1.0.16".
          # A FRESH install on a cold runner therefore resolves the newest 1.x —
          # and 1.0.18 (a PATCH release) removed `Hmr.registerConfig`, while
          # 1.0.19 keeps it removed. Verified against the published tarballs:
          #   1.0.16 -> registerConfig present | 1.0.17 -> present
          #   1.0.18 -> REMOVED                | 1.0.19 -> REMOVED
          # dsh-app-boot still calls `hmr.registerConfig(filename, refresh)`, so on
          # the runner the boot dies with
          #   TypeError: hmr.registerConfig is not a function
          #     at watchUserPatches (dsh-app-boot/lib/index.js:767 -> profile-boot)
          # and, when the auto-created service is not registered in time, with
          #   "user patch-layer watching requires the Cordis HMR service".
          # The working host runs 1.0.16, which is why the same dsh + node + profile
          # boots fine locally and only the runner fails.
          # The gate must test rc.2 against the plugin API rc.2 was built for, so pin
          # the plugin to the last compatible version and FAIL LOUDLY if that API is
          # missing: a future drift must never again look like a mysterious boot crash.
          # ==========================================================================
          $prefix = Split-Path (Get-Command dsh).Source
          $hmrDir = Join-Path $prefix 'node_modules\@deepseek-ai\dsh\node_modules\@deepseek-ai\cordis-plugin-hmr'
          if (-not (Test-Path $hmrDir)) { throw "AC10: HMR plugin dir not found: $hmrDir" }
          $pin = Join-Path $env:RUNNER_TEMP 'hmr-pin'
          Remove-Item $pin -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $pin | Out-Null
          # cmd /c does the redirection: PowerShell 5.1 turns native stderr into a
          # terminating error when `2>&1`/`*>` is used, which would abort this step
          # even though npm pack succeeded.
          $packLog = Join-Path $pin 'pack.log'
          cmd /c "npm pack @deepseek-ai/cordis-plugin-hmr@1.0.16 --pack-destination `"$pin`" > `"$packLog`" 2>&1"
          if ($LASTEXITCODE -ne 0) { Get-Content $packLog | Write-Host; throw 'AC10: npm pack failed for @deepseek-ai/cordis-plugin-hmr@1.0.16' }
          $tgz = Get-ChildItem $pin -Filter '*.tgz' | Select-Object -First 1
          if (-not $tgz) { throw 'AC10: could not download @deepseek-ai/cordis-plugin-hmr@1.0.16' }
          tar -xzf $tgz.FullName -C $pin
          if (-not (Test-Path (Join-Path $pin 'package\lib\index.js'))) { throw 'AC10: unexpected hmr tarball layout' }
          Remove-Item (Join-Path $hmrDir 'lib\index.js') -Force
          Copy-Item (Join-Path $pin 'package\lib\index.js') (Join-Path $hmrDir 'lib\index.js') -Force
          Copy-Item (Join-Path $pin 'package\package.json') (Join-Path $hmrDir 'package.json') -Force
          $hmrVer = [regex]::Match((Get-Content -Raw (Join-Path $hmrDir 'package.json')), '"version"\s*:\s*"([^"]+)"').Groups[1].Value
          $hmrApi = (Get-Content -Raw (Join-Path $hmrDir 'lib\index.js')).Contains('registerConfig')
          Write-Host "AC10: hmr plugin pinned to $hmrVer (registerConfig=$hmrApi)"
          if ($hmrApi -ne $true) { throw "AC10: HMR plugin API mismatch: $hmrVer has no Hmr.registerConfig, which dsh-app-boot requires" }

      - name: AC10 diag - native internal-loader addon probe (never gates)
        # AC10 RELEASE GATE (2026-09-29): the runner boot dies with
        # "user patch-layer watching requires the Cordis HMR service", i.e. the HMR
        # plugin never registered its service. The HMR plugin refuses to register
        # without loader.internal, which cordis-plugin-loader obtains either from
        # `--expose-internals` (absent here, exactly as dsh runs it) or from the
        # OPTIONAL native package node-addon-require-builtin-<platform>. This step
        # reports which path this runner has, plus the resolved platform package and
        # its prebuilt binary. Diagnostic only: continue-on-error keeps it from
        # gating the job (the boot step below still fails the job on its own).
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host "=== runner npm/node facts ==="
          Write-Host "node: $(node --version)"
          Write-Host "npm:  $(npm --version)"
          Write-Host "omit: [$((npm config get omit 2>&1) -join '')]"
          Write-Host "optional: [$((npm config get optional 2>&1) -join '')]"
          Write-Host "registry: $((npm config get registry 2>&1) -join '')"
          $dshCmd = (Get-Command dsh).Source
          $dshRoot = Join-Path (Split-Path $dshCmd) 'node_modules'
          $install = Join-Path $dshRoot '@deepseek-ai\dsh'
          Write-Host "=== installed node-addon-* packages ==="
          foreach ($dir in @($dshRoot, (Join-Path $install 'node_modules'))) {
            Get-ChildItem $dir -Directory -Filter 'node-addon-*' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
          }
          Write-Host "=== native binaries under the dsh install ==="
          Get-ChildItem (Join-Path $install 'node_modules') -Recurse -Filter '*.node' -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
          Write-Host "=== the exact call cordis-plugin-loader makes ==="
          $anchor = Join-Path $install 'node_modules\@deepseek-ai\cordis-plugin-loader\lib\index.js'
          node tests\ci\loader-internal-probe.cjs $anchor
          Write-Host "probe exit: $LASTEXITCODE (0 = loader.internal available, 1 = undefined)"
          Write-Host "=== same probe with --expose-internals ==="
          node --expose-internals tests\ci\loader-internal-probe.cjs $anchor
          Write-Host "probe(--expose-internals) exit: $LASTEXITCODE"

      - name: AC10 diag - HMR entry tree on the runner (never gates)
        # AC10 RELEASE GATE (2026-09-29): the boot step below dies with
        # "user patch-layer watching requires the Cordis HMR service".
        # profile-boot's fallback calls loader.create() for the HMR plugin, and
        # loader.create() RE-THROWS its own failures - so a failing HMR plugin
        # would have been the reported error. It is not, which means create()
        # resolved while ctx.get('hmr') stayed undefined: the entry is pending or
        # its fiber failed after start. This step boots the same sanitized
        # manifest with an entry-diag plugin inserted first (it wraps
        # loader.create and prints the entry tree, fiber state and service
        # presence), plus two variants: the dsh-base `hmr` row re-enabled
        # (dsh-web-app disables it - "TODO: Re-enable shared HMR for Web"), and
        # the same boot under --expose-internals (HMR's other supported path).
        # Diagnostic only: continue-on-error keeps it from gating the job.
        continue-on-error: true
        shell: pwsh
        run: |
          $gatePlugins = @(
            'completion-notify.mjs','keepalive-patch.mjs',
            'model-selection-guard.mjs','execution-continuity.mjs',
            'context-memory.mjs','supervisor-bridge.mjs'
          )
          function Boot-Variant {
            param([string]$Name, [int]$Port, [string[]]$ExtraRows, [switch]$ExposeInternals, [string]$DiagConfig = '{}')
            # NB: $home is read-only in PowerShell (it aliases $HOME); use a distinct name.
            $variantHome = Join-Path $env:RUNNER_TEMP "dsh-home-$Name"
            Remove-Item $variantHome -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path (Join-Path $variantHome 'profiles\web') | Out-Null
            Get-ChildItem 'plugins' -Filter '*.mjs' | Where-Object { $_.Name -notmatch 'test' } | ForEach-Object { Copy-Item $_.FullName (Join-Path $variantHome 'profiles\web') -Force }
            $rows = @("- insert:`n    - id: ac10-entry-diag`n      name: './ac10-entry-diag.mjs'`n      config: $DiagConfig")
            foreach ($pn in $gatePlugins) {
              if (Test-Path (Join-Path 'plugins' $pn)) { $rows += "- insert:`n    - id: ci-$($pn.Replace('.mjs',''))`n      name: './$pn'`n      config: {}" }
            }
            foreach ($row in $ExtraRows) { $rows += $row }
            Set-Content -Path (Join-Path $variantHome 'profiles\web\cordis.patch.yml') -Value ($rows -join "`n") -Encoding UTF8
            Set-Content -Path (Join-Path $variantHome 'profiles\web\cordis.yml') -Value '[]' -Encoding UTF8
            $env:DSH_HOME = $variantHome
            $out = Join-Path $env:RUNNER_TEMP "$Name.out.txt"
            $err = Join-Path $env:RUNNER_TEMP "$Name.err.txt"
            Remove-Item $out, $err -Force -ErrorAction SilentlyContinue
            $dshCmd = Join-Path (Split-Path (Get-Command dsh).Source) 'dsh.cmd'
            $install = Join-Path (Split-Path (Get-Command dsh).Source) 'node_modules\@deepseek-ai\dsh'
            if ($ExposeInternals) {
              Write-Host "launch: node --expose-internals $install\lib\bin.js"
              $proc = Start-Process -FilePath 'node' -ArgumentList "--expose-internals `"$(Join-Path $install 'lib\bin.js')`" web --port $Port --no-open" -PassThru -WindowStyle Hidden -RedirectStandardOutput $out -RedirectStandardError $err
            } else {
              $proc = Start-Process -FilePath 'cmd.exe' -ArgumentList "/c `"$dshCmd`" web --port $Port --no-open" -PassThru -WindowStyle Hidden -RedirectStandardOutput $out -RedirectStandardError $err
            }
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited -and $i -gt 2) { break }
              try {
                $r = Invoke-RestMethod -Uri "http://127.0.0.1:$Port/api/host.describe" -Method Post -Body '{"type":"client-request","rpcId":"smoke","method":"host.describe","payload":{}}' -ContentType 'application/json' -TimeoutSec 3 -ErrorAction Stop
                if ($r.result.ok) { $ready = $true; break }
              } catch { }
            }
            Write-Host "---------- variant '$Name' : ready=$ready exited=$($proc.HasExited) exit=$(if ($proc.HasExited) { $proc.ExitCode } else { '-' }) ----------"
            Write-Host "--- child stdout ---"
            if (Test-Path $out) { Get-Content $out | ForEach-Object { Write-Host "  $_" } } else { Write-Host '  (none)' }
            Write-Host "--- child stderr (tail) ---"
            if (Test-Path $err) { Get-Content $err -Tail 25 | ForEach-Object { Write-Host "  $_" } } else { Write-Host '  (none)' }
            if (-not $proc.HasExited) { taskkill /PID $proc.Id /T /F 2>&1 | Out-Null }
          }
          # AC10 ROOT CAUSE (2026-09-29): two variants, one cycle, both non-gating.
          #  A) hmr-plain = exactly the gate's manifest: relies on dsh's boot-time HMR
          #     auto-create. This is what the gate runs.
          #  B) hmr-early = the diag plugin creates the HMR entry itself from apply(),
          #     which prints the entry store, fiber state + fiber error, the resolved
          #     plugin path, and `ctx.get('hmr')` after the create resolves.
          # That diag is what found the real cause: the resolved plugin had NO
          # `Hmr.registerConfig` (its ownKeys lacked configs/refreshTasks), i.e. the
          # runner install resolved cordis-plugin-hmr 1.0.19, which dropped the method
          # dsh-app-boot calls. See the pin + assertion in the install step above.
          Boot-Variant -Name 'hmr-plain' -Port 33124 -ExtraRows @()
          Boot-Variant -Name 'hmr-early' -Port 33125 -ExtraRows @() -DiagConfig '{ earlyHmr: true }'

      - name: Boot dsh web on ephemeral port with sanitized ACTIVE plugin manifest
        shell: pwsh
        run: |
          $port = 33123
          $env:DSH_HOME = Join-Path $env:RUNNER_TEMP 'dsh-home'
          New-Item -ItemType Directory -Force -Path $env:DSH_HOME | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $env:DSH_HOME 'profiles\web') | Out-Null
          # Phase 02 R4 (Step 10): build a SANITIZED ACTIVE plugin manifest from
          # the repo's own plugins/ (copy them into the profile dir so the boot
          # loads the REAL custom-plugin surface, not an empty profile). No
          # secrets: this manifest only references plugin files + no-op config.
          if (Test-Path 'plugins') {
            # Phase 02 R4 (Step 10): smoke loads a REPRESENTATIVE real plugin set
            # (lightweight, no external credentials needed). Full 12-plugin
            # surface is exercised locally/on-device; CI proves the current dsh
            # version boots with REAL repo plugins (not an empty profile).
            $active = @(
              'completion-notify.mjs','keepalive-patch.mjs',
              'model-selection-guard.mjs','execution-continuity.mjs',
              'context-memory.mjs','supervisor-bridge.mjs'
            )
            # copy every plugin module (main + their core/helper deps) so
            # imports resolve inside the profile dir
            Get-ChildItem 'plugins' -Filter '*.mjs' | Where-Object { $_.Name -notmatch 'test' } | ForEach-Object { Copy-Item $_.FullName (Join-Path $env:DSH_HOME 'profiles\web') -Force }
            $manifest = @()
            foreach ($pn in $active) {
              if (Test-Path (Join-Path 'plugins' $pn)) {
                $manifest += "- insert:`n    - id: ci-$($pn.Replace('.mjs',''))`n      name: './$pn'`n      config: {}"
              }
            }
            # AC10 RELEASE GATE (2026-09-29): the manifest is the REAL sanitized user
            # patch layer (repo plugins only). An earlier hypothesis restated dsh-base's
            # HMR row here; that was wrong — declaring the row only turns dsh's
            # swallowed auto-create failure into a hard "TypeError:
            # hmr.registerConfig is not a function" crash, because the real cause is
            # the plugin version resolved on the runner (see the pin in the install
            # step). The gate now runs the honest boot path: dsh brings up HMR itself
            # from the version-aligned install.
            $patchContent = $manifest -join "`n"
            if (-not $patchContent) { $patchContent = '[]' }            Set-Content -Path (Join-Path $env:DSH_HOME 'profiles\web\cordis.patch.yml') -Value $patchContent -Encoding UTF8
          } else {
            Set-Content -Path (Join-Path $env:DSH_HOME 'profiles\web\cordis.patch.yml') -Value '[]' -Encoding UTF8
          }
          Set-Content -Path (Join-Path $env:DSH_HOME 'profiles\web\cordis.yml') -Value '[]' -Encoding UTF8
          # Phase 02 R4: launch via cmd /c dsh so the npm .cmd wrapper resolves
          # (Start-Process on (Get-Command dsh).Source can hit the .ps1 shim
          # which Start-Process cannot execute directly).
          # AC10 RELEASE GATE (2026-09-29): the previous shape launched the child
          # with NO stdio capture, so a boot crash surfaced only as
          # "no connection could be made" and the REAL cause was invisible in CI
          # (the log dump looked at %LOCALAPPDATA%\DSHHarness\logs, which is the
          # desktop launcher's directory and never exists on a clean runner).
          # Now the child's stdout/stderr are captured to files, its exit code is
          # reported, and the real runtime facts are dumped on failure. The gate
          # stays STRICT: readiness failure still exits 1.
          $dshCmd = Join-Path (Split-Path (Get-Command dsh).Source) 'dsh.cmd'
          if (-not (Test-Path $dshCmd)) { $dshCmd = (Get-Command dsh).Source }
          $bootOut = Join-Path $env:RUNNER_TEMP 'dsh-boot.out.txt'
          $bootErr = Join-Path $env:RUNNER_TEMP 'dsh-boot.err.txt'
          Remove-Item $bootOut, $bootErr -Force -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath 'cmd.exe' -ArgumentList "/c `"$dshCmd`" web --port $port --no-open" -PassThru -WindowStyle Hidden -RedirectStandardOutput $bootOut -RedirectStandardError $bootErr
          $ready = $false
          $lastErr = ''
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            # fail fast (with the captured cause) when the child already died —
            # a crashed boot must not burn the full readiness budget
            if ($proc.HasExited -and $i -gt 2) { break }
            try {
              $r = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/host.describe" -Method Post -Body '{"type":"client-request","rpcId":"smoke","method":"host.describe","payload":{}}' -ContentType 'application/json' -TimeoutSec 3 -ErrorAction Stop
              if ($r.result.ok) { $ready = $true; break }
            } catch { $lastErr = $_.Exception.Message }
          }
          if (-not $ready) {
            # Phase 02 R4 (Step 10): readiness failure MUST fail the job — a
            # "partial" pass hides boot regressions. Dump diagnostics first.
            Write-Host "=== manifest ==="
            Get-Content (Join-Path $env:DSH_HOME 'profiles\web\cordis.patch.yml')
            Write-Host "=== runtime facts ==="
            Write-Host "node: $(node --version 2>&1)"
            Write-Host "dsh:  $((& dsh --version 2>&1 | Out-String).Trim())"
            # AC10 ROOT CAUSE (2026-09-29): the HMR plugin version decides whether the
            # boot can watch the user patch layer at all. Report its version and whether
            # it still exposes Hmr.registerConfig (dropped upstream in 1.0.18).
            $hmrPkgPath = Join-Path (Split-Path $dshCmd) 'node_modules\@deepseek-ai\dsh\node_modules\@deepseek-ai\cordis-plugin-hmr\package.json'
            if (Test-Path $hmrPkgPath) {
              $hmrDirPath = Split-Path $hmrPkgPath
              $hmrVer = [regex]::Match((Get-Content -Raw $hmrPkgPath), '"version"\s*:\s*"([^"]+)"').Groups[1].Value
              $hmrApi = (Get-Content -Raw (Join-Path $hmrDirPath 'lib\index.js')).Contains('registerConfig')
              Write-Host "hmr plugin: $hmrVer (registerConfig=$hmrApi)"
            } else {
              Write-Host "hmr plugin: NOT FOUND at $hmrPkgPath"
            }
            Write-Host "dshCmd: $dshCmd (exists=$(Test-Path $dshCmd))"
            Write-Host "DSH_HOME: $env:DSH_HOME"
            Write-Host "child exit code: $(if ($proc.HasExited) { $proc.ExitCode } else { 'still-running' })"
            Write-Host "=== child stdout ==="
            if (Test-Path $bootOut) { Get-Content $bootOut -Tail 80 } else { Write-Host '(no stdout file)' }
            Write-Host "=== child stderr ==="
            if (Test-Path $bootErr) { Get-Content $bootErr -Tail 80 } else { Write-Host '(no stderr file)' }
            Write-Host "=== port state ==="
            Get-NetTCPConnection -LocalPort $port -ErrorAction SilentlyContinue | Out-String | Write-Host
            Write-Host "=== dsh home tree ==="
            Get-ChildItem -Path $env:DSH_HOME -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 60 FullName, Length | Out-String | Write-Host
            Write-Host "=== dsh logs ==="
            Get-ChildItem -Path $env:DSH_HOME, (Join-Path $env:APPDATA 'dsh'), (Join-Path $env:LOCALAPPDATA 'DSHHarness\logs') -Recurse -Filter '*.log' -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "--- $($_.FullName) ---"
              Get-Content $_.FullName -Tail 25 -ErrorAction SilentlyContinue
            }
            # AC10 RELEASE GATE (2026-09-29): the boot crash on the runner is
            # "user patch-layer watching requires the Cordis HMR service", which
            # means `ctx.get('hmr')` stayed undefined after dsh auto-created the
            # HMR plugin. dsh resolves in-box plugins through the flat module
            # fallback `$DSH_HOME/profiles/node_modules` (one junction per package
            # of the installation closure, maintained by dsh-app-boot). Dump that
            # fallback and run Node's own resolution walk from both anchors, so
            # "fallback never built" is distinguishable from "built but
            # unresolvable" without another round trip.
            Write-Host "=== AC10 diag: dsh installation layout ==="
            $dshRoot = Join-Path (Split-Path $dshCmd) 'node_modules'
            $install = Join-Path $dshRoot '@deepseek-ai\dsh'
            Write-Host "dshRoot:  $dshRoot"
            Write-Host "install:  $install (package.json=$(Test-Path (Join-Path $install 'package.json')))"
            Write-Host "install-level hmr:   $(Test-Path (Join-Path $install 'node_modules\@deepseek-ai\cordis-plugin-hmr'))"
            Write-Host "install-level timer: $(Test-Path (Join-Path $install 'node_modules\@deepseek-ai\cordis-plugin-timer'))"
            Write-Host "root-level hmr:      $(Test-Path (Join-Path $dshRoot '@deepseek-ai\cordis-plugin-hmr'))"
            Write-Host "root-level timer:    $(Test-Path (Join-Path $dshRoot '@deepseek-ai\cordis-plugin-timer'))"
            Write-Host "=== AC10 diag: profiles module fallback ==="
            $farm = Join-Path $env:DSH_HOME 'profiles\node_modules'
            Write-Host "farm: $farm (exists=$(Test-Path $farm))"
            if (Test-Path $farm) {
              Write-Host "farm entry count: $((Get-ChildItem $farm -Force -ErrorAction SilentlyContinue).Count)"
              Write-Host "farm top10: $((Get-ChildItem $farm -Force -ErrorAction SilentlyContinue | Select-Object -First 10 | ForEach-Object { $_.Name }) -join ', ')"
              foreach ($rel in '@deepseek-ai\cordis-plugin-hmr', '@deepseek-ai\cordis-plugin-timer') {
                $link = Join-Path $farm $rel
                if (Test-Path $link) {
                  $item = Get-Item $link -Force
                  Write-Host "farm $rel => linkType=$($item.LinkType) target=$($item.Target)"
                } else { Write-Host "farm $rel => MISSING" }
              }
            }
            Write-Host "=== AC10 diag: node resolution walk (the walk the loader takes) ==="
            foreach ($anchor in @((Join-Path $env:DSH_HOME 'profiles\web\package.json'), (Join-Path $install 'package.json'))) {
              if (Test-Path $anchor) {
                node tests\ci\profile-module-resolution-probe.cjs $anchor '@deepseek-ai/cordis-plugin-hmr' '@deepseek-ai/cordis-plugin-timer'
              } else { Write-Host "anchor missing: $anchor" }
            }
            Write-Host "FAIL: dsh smoke did not reach api_ready on CI runner (lastErr=$lastErr)"
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host 'PASS: dsh api_ready with sanitized active plugin manifest'
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue

      - name: Context-memory unit regression on main-branch gate (P2.5 R2)
        shell: pwsh
        run: |
          # P2.5 R2 (R2-1): the deployment gate re-runs the full context-memory
          # unit suite (incl. R2-7 blocker-close semantics) so a regression
          # cannot reach main even if Level 1 is skipped or re-based.
          node tests\context-memory\verify-context-memory.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "DEPLOYMENT GATE: CONTEXT-MEMORY REGRESSION FAIL"; exit 1 }
          Write-Host 'PASS: context-memory unit regression on deployment gate'

      - name: Install-plugin regression on main-branch gate (P2.5 R2-2)
        shell: pwsh
        run: |
          # P2.5 R2-2: the authoritative installer's atomic-write + auto hash
          # check must hold on the deployment gate too (a broken installer is a
          # restart-blocker-class defect). Temp dirs only, never touches ~/.dsh.
          npm install -g js-yaml
          if ($LASTEXITCODE -ne 0) { Write-Host "DEPLOYMENT GATE: npm install js-yaml FAILED"; exit 1 }
          node tests\install-plugin\verify-install-plugin.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "DEPLOYMENT GATE: INSTALL-PLUGIN REGRESSION FAIL"; exit 1 }
          Write-Host 'PASS: install-plugin regression on deployment gate'

      # ─── P2.6 R3 T-R3-1..7 (Round 3 A1/A2) on the deployment gate ────────────
      # These suites need the OFFICIAL dsh-llm-retry / dsh-llm packages, which
      # only exist after `npm install -g @deepseek-ai/dsh@0.1.1-rc.2` above — so
      # they live on Level 3 (NOT Level 2, which has no dsh install). No secrets:
      # retry-policy runs against the sanitized repo fixture (DSH_SETTINGS), and
      # A1 asserts same-provider llm/retry counts on synthetic request-errors.
      - name: T-R3-1 R3 retry policy settings+schema+taxonomy regression
        shell: pwsh
        run: |
          $env:DSH_SETTINGS = Join-Path $env:GITHUB_WORKSPACE 'tests\fixtures\p26-r3-settings.sanitized.yaml'
          # dsh is globally installed above; expose the REAL npm global root so
          # the suite can resolve js-yaml / dsh-llm regardless of npm prefix
          # (GitHub runner prefix != local %APPDATA%\npm).
          $env:DSH_GLOBAL_ROOT = (npm root -g).Trim()
          node tests\continuity\verify-p26-r3-retry-policy.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "T-R3-1 RETRY-POLICY FAIL"; exit 1 }
          Write-Host "T-R3-1 retry-policy: PASS"

      - name: T-R3-2..6 R3-A1 official-layer retry-zero proof (1310/1305/transient)
        # CONTROLLED full-path proof that the OFFICIAL dsh-llm-retry middleware
        # emits ZERO same-provider llm/retry for 1310 (RATE_LIMIT excluded from
        # retryableCodes) while still retrying transient SERVER/TIMEOUT and
        # provider-overload 1305 via EC bounded retry. Uses the real official
        # middleware package (resolved from the globally installed dsh); no mock
        # of the official retry decision.
        shell: pwsh
        run: |
          $env:DSH_GLOBAL_ROOT = (npm root -g).Trim()
          node tests\continuity\verify-p26-r3-a1-official-retry-zero.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "T-R3-2..6 OFFICIAL-RETRY-ZERO FAIL"; exit 1 }
          Write-Host "T-R3-2..6 official retry-zero: PASS"

      - name: T-R3-7 failure classifier reset-time regressions (incl. reverse-ISO-Z)
        shell: pwsh
        run: |
          node tests\reliability\test-failure-classifier-v1.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "T-R3-7 CLASSIFIER FAIL"; exit 1 }
          Write-Host "T-R3-7 classifier regressions: PASS"

      # ─── P2.75 SUPERVISOR isolated real E2E (R1.1, Round 2 Blocker C) ─────────
      # Three-phase REAL E2E on isolated DSH_HOME instances booted from the
      # globally installed dsh (same as the smoke above; NO external
      # credentials needed — SB_MODE=ci replaces model-turn assertions with
      # deterministic ones; full mode stays local-only).
      #   phase 1: homeA (supervisor-bridge) -> boot -> negatives(401/404/400)
      #            + dispatch + idempotent re-dispatch + corrections + cancel
      #            + review/evidence bundle + snapshot metadata-only
      #   phase 2: homeA RESTART (bridge restart semantics) -> replay must not
      #            cause second side effects + corrupt-ledger fail-closed
      #   phase 3: homeB (NO bridge) -> /supervisor/* absent, host surface
      #            unaffected (disabled baseline)
      # Temp homes are destroyed at the end (KEEP=1 to retain for debugging).
      - name: P2.75 Supervisor isolated real E2E (dispatch/review, bridge-restart replay, disabled baseline)
        shell: pwsh
        run: |
          $env:SB_MODE = 'ci'
          node tests\supervisor\run-supervisor-ci-e2e.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host "P275-R1-1 SUPERVISOR REAL E2E FAIL"; exit 1 }
          Write-Host 'P2.75 R1.1 supervisor isolated real E2E (3 phases): PASS'

      - name: Guardian !!js regression on main-branch gate (P2.5 R2-8)
        shell: pwsh
        run: |
          # R2-8: guardian's Test-YamlFile must treat !!js-tagged configs as
          # VALID (not INVALID, which would roll back guardian-lastgood).
          # Source-integrity + behavioral: extracts guardian's real probe code
          # and runs it against isolated fixtures.
          # js-yaml must exist for the extracted probe to run: install it the
          # same way the install-plugin gate does, WITHOUT swallowing failures
          # (a silent npm failure previously left the probe with no js-yaml),
          # and export NODE_PATH=(npm root -g) exactly like the YAML-parse gate.
          npm install -g js-yaml
          if ($LASTEXITCODE -ne 0) { Write-Host "DEPLOYMENT GATE: npm install js-yaml FAILED"; exit 1 }
          $env:NODE_PATH = (npm root -g)
          node tests\reliability\verify-guardian-js-tag.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host 'DEPLOYMENT GATE: GUARDIAN !!JS REGRESSION FAIL'; exit 1 }
          Write-Host 'PASS: guardian !!js regression on deployment gate'

      - name: RH1 R2 harness — liveness/readiness + reconnect + incident redaction + authority
        shell: pwsh
        run: |
          # RH1 R2 (review round 2 blockers 1/3/G9): run the whole RH1 harness on the
          # deployment gate. It uses a THROWAWAY disposable server on 33183 and the
          # PURE reconnect/health state machines with an injected clock — it NEVER
          # touches port 3080 or the real dsh server, so it is safe in CI.
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\rh1-tests.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host 'DEPLOYMENT GATE: RH1 R2 HARNESS FAIL'; exit 1 }
          Write-Host 'PASS: RH1 R2 harness (G0..G21, exit 0)'

      - name: Release identity attestation (source -> deployment manifest)
        shell: pwsh
        run: |
          # Phase 02 R4 (Step 10): record that the smoke loaded the current
          # repo content; a mismatch between source and loaded process manifest
          # must be detectable (this step surfaces the version + profile hash).
          $srcHash = ''
          if (Test-Path 'cordis.patch.yml') { $srcHash = (Get-FileHash 'cordis.patch.yml').Hash }
          elseif (Test-Path 'plugins') { $srcHash = ((Get-ChildItem 'plugins' -Filter '*.mjs' | Get-FileHash).Hash | Sort-Object -Unique | Select-Object -First 1) }
          $dshVer = (& dsh --version 2>$null | Out-String).Trim()
          Write-Host "DSH_VERSION=$dshVer"
          Write-Host "SOURCE_SHA256=$srcHash"
          if (-not $dshVer) { Write-Host 'FAIL: dsh --version unavailable'; exit 1 }
          Write-Host 'PASS: release identity recorded'

      # ── P4 LEARN AC6 real isolated promotion e2e ────────────────────────────────
      # Why L3 and not L2: this is the ISOLATED-REAL-INSTANCE gate. It really creates
      # a git worktree + commits the candidate on its own branch, really boots an
      # isolated host via tests/learn/mount-gate.mjs --hold on port 3099 (never the
      # production 3080 — it verifies the production listener set is unchanged before
      # and after), really runs the ci-level2.yml job command list at that commit
      # (parsed out of the workflow, so the two lanes cannot drift), and really drives
      # dsh-transaction.ps1 to COMMITTED, then cross-checks the three legs against the
      # candidate's derived label — plus a negative leg: tampering with any one leg
      # must be rejected with telemetry and an unchanged state.
      # It needs an installed dsh package (dsh-disposable/mount-gate), which is why it
      # belongs in the lane that installs dsh (L3), not in L1/L2. This is also the
      # workflow that plugins/learn-candidate.mjs STAGE_DELEGATION.ISOLATED_TESTS.file
      # now names as the isolated-test lane, and tests/learn/validate-gate-registry.mjs
      # (L1) fails closed if that pointer and this invocation ever disagree.
      # Runner-portability: DSH_BIN is resolved from `npm root -g` (no assumptions
      # about a developer %APPDATA% path); the test also accepts the env var.
      - name: P4 LEARN AC6 real promotion e2e (real git + real CI job commands + real transaction)
        shell: pwsh
        run: |
          $root = (npm root -g)
          $env:DSH_BIN = Join-Path $root '@deepseek-ai\dsh\lib\bin.js'
          if (-not (Test-Path $env:DSH_BIN)) { Write-Host "AC6: dsh bin not found at $env:DSH_BIN"; exit 1 }
          # the test commits into a worktree, so git needs an identity on a clean runner
          git config --global user.email 'ci@dsh.invalid'
          git config --global user.name 'dsh ci'
          Write-Host "AC6 DSH_BIN=$env:DSH_BIN"
          node tests\learn\test-learn-ac6-real-promotion-e2e.mjs
          if ($LASTEXITCODE -ne 0) { Write-Host 'AC6 REAL PROMOTION E2E FAIL'; exit 1 }
          Write-Host 'PASS: AC6 real promotion e2e (isolated host 3099, production 3080 untouched)'
